[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "summary"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28,<2",
    "pillow>=12",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.25",
    "cursor-sdk>=1.0.37,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["summary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
